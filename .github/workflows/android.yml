name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_run:
        description: 'Optional verified run ID: export its existing screenshots only (no rebuild)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.preview_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android platform
        run: ./scripts/ci-run.sh "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, and debug APK
        run: ./scripts/ci-run.sh ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --console=plain
      - name: Publish test and schema diagnostics
        if: always()
        run: python3 scripts/ci-report.py --schema
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-and-lint-reports
          path: |
            core/build/reports/
            app/build/reports/
            app/schemas/
      - uses: actions/upload-artifact@v5
        with:
          name: immortal-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  persistence-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/ci-device-tests.sh
      - name: Publish bounded UI previews
        if: always() && matrix.api == 35
        run: python3 scripts/ci-ui-previews.py
      - name: Publish device test diagnostics
        if: always()
        run: python3 scripts/ci-report.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/ui-previews/

  preview-export:
    if: ${{ inputs.preview_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: device-test-reports-api-35
          run-id: ${{ inputs.preview_run }}
          github-token: ${{ github.token }}
          path: app/build
      # Runner permits only ten notices per step, each under 4 KiB.
      - run: python3 scripts/ci-ui-previews.py --batch 0
      - run: python3 scripts/ci-ui-previews.py --batch 1
      - run: python3 scripts/ci-ui-previews.py --batch 2
      - run: python3 scripts/ci-ui-previews.py --batch 3
      - run: python3 scripts/ci-ui-previews.py --batch 4
      - run: python3 scripts/ci-ui-previews.py --batch 5
      - run: python3 scripts/ci-ui-previews.py --batch 6
      - run: python3 scripts/ci-ui-previews.py --batch 7
      - run: python3 scripts/ci-ui-previews.py --batch 8
      - run: python3 scripts/ci-ui-previews.py --batch 9
      - run: python3 scripts/ci-ui-previews.py --batch 10
      - run: python3 scripts/ci-ui-previews.py --batch 11
